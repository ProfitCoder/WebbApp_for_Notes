<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web for notes</title>
    <link rel="StyleSheet" href="./src/css/style.css">
    <link rel="icon" href="./src/img/images-removebg-preview.png">
    <script type="module" src="./src/script/main.js"></script>  
</head>
<body>

    <!-- Cabecera -->

    <header>
        <h1>Webs For Notes</h1>
    </header>

    <!-- Contenido Principal -->

    <main>

        <div id="panelLogin">
            <h1>Iniciar Sesion</h1>

            <button type="IniciarSesion" id="sesionIni">Iniciar Sesion con Google</button>
            
            <div id="formlogin">
                <label id="correo">Correo: </label>
                <input type="text" id="" name="correo" required>
    
                <label id="contraseña">Contraseña: </label>
                <input type="password" id="password" name="contraseña" required>

                <button id="IniciarSesionC">Iniciar Sesion con Correo y contraseña</button>

                <button type="button" id="registrarCorreo">
                    Registrarse
                </button>
            </div>
        </div>

        <section id="PostIt"></section>

        <div id="confirmarBorrado" hidden>
            <p>¿Quieres borrar esta nota?</p>

            <button type="button" id="cancelarBorrado" value="cancelar">Cancelar</button>
            <button type="button" id="borrarNota" value="borrar">Borrar</button>
        </div>
    </main>

    <!-- Apartado del footer -->

    <footer>
        <p>&copy;2026 - ProfitCoder</p>
        <button id="Add">+</button>
    </footer>
</body>
</html>

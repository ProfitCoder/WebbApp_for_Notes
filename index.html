<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web for Notes</title>

    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="icon" href="./src/img/images-removebg-preview.png">

    <script type="module" src="./src/script/main.js"></script>
</head>

<body>

    <!-- Cabecera -->

    <header>
        <h1>Webs For Notes</h1>

        <button type="button" id="cerrarSesion" hidden>
            Cerrar sesión
        </button>
    </header>


    <!-- Contenido Principal -->

    <main>

        <!-- Panel de inicio de sesión y registro -->

        <div id="panelLogin">

            <h2>Bienvenido a Webs For Notes</h2>

            <p>Inicia sesión o regístrate para guardar tus notas.</p>

            <!-- Inicio de sesión con Google -->

            <div>
                <button type="button" id="sesionIni">
                    Iniciar sesión con Google
                </button>
            </div>

            <!-- Inicio de sesión con correo -->

            <div id="formlogin">

                <h3>Accede con tu correo electrónico</h3>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required
                       placeholder="Introduce tu correo">

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required
                       placeholder="Introduce tu contraseña">

                <button type="button" id="IniciarSesionC">
                    Iniciar sesión
                </button>

                <button type="button" id="registrarCorreo">
                    Crear cuenta
                </button>

            </div>

        </div>

        <!-- Tablero de notas -->

        <section id="PostIt"></section>


        <!-- Confirmación para eliminar notas -->

        <div id="confirmarBorrado" hidden>

            <p>¿Quieres borrar esta nota?</p>

            <button type="button" id="cancelarBorrado" value="cancelar">
                Cancelar
            </button>

            <button type="button" id="borrarNota" value="borrar">
                Borrar
            </button>

        </div>

    </main>


    <!-- Pie de página -->

    <footer>
        <p>&copy; 2026 - ProfitCoder</p>

        <button type="button" id="Add">+</button>
    </footer>

</body>
</html>

name: Publicar web de notas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Preparar la web
        env:
          FIREBASE_CONFIG_JS: ${{ secrets.FIREBASE_CONFIG_JS }}
        run: |
          test -n "$FIREBASE_CONFIG_JS"
          mkdir -p public
          cp index.html public/
          cp -r src public/
          printf '%s\n' "$FIREBASE_CONFIG_JS" > public/src/script/firebase_config.js

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
